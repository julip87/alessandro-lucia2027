<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucia & Alessandro · 19.06.2027</title>
  <meta name="description" content="Il matrimonio di Lucia e Alessandro — 19 Giugno 2027, Salerno." />
  <meta name="theme-color" content="#E89A3D" />
  <link rel="alternate" hreflang="it" href="it/index.html" />
  <link rel="alternate" hreflang="es" href="es/index.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Contenitore a tutto schermo per centrare la scheda */
    .lang-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Scheda del selettore */
    .lang-card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 50px 30px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
    }

    /* Data "19 · 06 · 2027" */
    .lang-eyebrow {
      color: var(--gold);
      letter-spacing: .3em;
      text-transform: uppercase;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 18px;
    }

    /* Titolo "Lucia & Alessandro" in Turchese */
    .lang-card h1 {
      font-family: var(--font-serif);
      color: var(--ink);
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      margin-bottom: 12px;
    }

    /* Sottotitolo */
    .lang-card .sub {
      color: var(--ink-soft);
      margin-bottom: 32px;
      font-size: 1rem;
    }

    /* Disposizione e allineamento bottoni */
    .lang-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .lang-buttons .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #FFFFFF;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      transition: all 0.25s ease;
    }

    /* Hover Bottone Secondario (Spagnolo) */
    .lang-buttons .btn:not(.btn-primary):hover {
      background-color: var(--bg-alt);
      border-color: var(--ink);
      color: var(--ink);
    }

    /* Bottone Primario (Italiano) */
    .lang-buttons .btn-primary {
      background-color: var(--ink);
      border-color: var(--ink);
      color: #FFFFFF;
    }

    .lang-buttons .btn-primary:hover {
      background-color: var(--gold);
      border-color: var(--gold);
      color: var(--ink-soft);
    }

    /* Stile Bandiere Vettoriali SVG */
    .flag-icon {
      width: 20px;
      height: 14px;
      border-radius: 2px;
      box-shadow: 0 0 1px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="lang-wrap">
    <div class="lang-card">
      <p class="lang-eyebrow">19 · 06 · 2027</p>
      <h1>Lucia &amp; Alessandro</h1>
      <p class="sub">Scegli la tua lingua · Elige tu idioma</p>
      <div class="lang-buttons">
        <a class="btn btn-primary" href="it/index.html">
          <svg class="flag-icon" viewBox="0 0 30 20">
            <rect width="10" height="20" x="0" fill="#009246"/>
            <rect width="10" height="20" x="10" fill="#ffffff"/>
            <rect width="10" height="20" x="20" fill="#ce2b37"/>
          </svg>
          Italiano
        </a>
        <a class="btn" href="es/index.html">
          <svg class="flag-icon" viewBox="0 0 30 20">
            <rect width="30" height="5" y="0" fill="#AA151B"/>
            <rect width="30" height="10" y="5" fill="#F1BF00"/>
            <rect width="30" height="5" y="15" fill="#AA151B"/>
          </svg>
          Español
        </a>
      </div>
    </div>
  </main>
</body>
</html>
