  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="site-brand">L &amp; A</a>
      <nav class="site-nav" aria-label="Menú principal">
        <ul class="site-nav-links">

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="hero-eyebrow">Confirmación</p>
        <h1 class="page-title">RSVP</h1>
        <p class="page-lead">Por favor, confirma antes del <strong>30 de junio de 2026</strong>.</p>
      </div>
    </section>

    <section class="section">
      <div class="container container-narrow">
        <form action="https://formspree.io/f/TUO_ID" method="POST" class="form">
          <label>Nombre y apellidos
            <input type="text" name="nombre" required />
          </label>
          <label>Email
            <input type="email" name="email" required />
          </label>
          <label>¿Asistirás?
            <select name="asistencia" required>
              <option value="">Selecciona…</option>
              <option value="si">Sí, allí estaré</option>
              <option value="no">No podré asistir</option>
            </select>
          </label>
          <label>Número de acompañantes
            <input type="number" name="acompanantes" min="0" max="5" value="0" />
          </label>
          <label>Alergias o intolerancias
            <textarea name="alergias" rows="3"></textarea>
          </label>
          <label>Mensaje para los novios
            <textarea name="mensaje" rows="4"></textarea>
          </label>
          <button type="submit" class="btn btn-primary">Enviar confirmación</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Lucía &amp; Alessandro · 12.09.2026</p>
